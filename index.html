<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-cloud-sun"></i> Weather Dashboard</h1>
            <p>Get current weather information for any location</p>
        </header>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Enter city name..." />
                <button id="searchBtn"><i class="fas fa-search"></i> Search</button>
            </div>
            <div id="errorMessage" class="error-message"></div>
        </div>

        <div class="weather-grid">
            <!-- Current Weather -->
            <div class="weather-card current-weather" id="currentWeather">
                <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
            </div>

            <!-- 5-Day Forecast -->
            <div class="forecast-section">
                <h2><i class="fas fa-calendar-days"></i> 5-Day Forecast</h2>
                <div class="forecast-grid" id="forecastGrid">
                    <div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
                </div>
            </div>
        </div>

        <!-- Additional Details -->
        <div class="details-section">
            <div class="detail-card">
                <h3><i class="fas fa-water"></i> Humidity</h3>
                <p id="humidity">--</p>
            </div>
            <div class="detail-card">
                <h3><i class="fas fa-wind"></i> Wind Speed</h3>
                <p id="windSpeed">--</p>
            </div>
            <div class="detail-card">
                <h3><i class="fas fa-eye"></i> Visibility</h3>
                <p id="visibility">--</p>
            </div>
            <div class="detail-card">
                <h3><i class="fas fa-gauge"></i> Pressure</h3>
                <p id="pressure">--</p>
            </div>
            <div class="detail-card">
                <h3><i class="fas fa-temperature-high"></i> Feels Like</h3>
                <p id="feelsLike">--</p>
            </div>
            <div class="detail-card">
                <h3><i class="fas fa-sun"></i> UV Index</h3>
                <p id="uvIndex">--</p>
            </div>
        </div>
    </div>

    <footer>
        <p>Data provided by <a href="https://openweathermap.org/" target="_blank">OpenWeatherMap</a></p>
        <p>© 2024 Weather Dashboard. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
